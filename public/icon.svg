<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer presence radar ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#10b981" stroke-width="6" opacity="0.25" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#10b981" stroke-width="8" opacity="0.4" />

  <!-- Stylized "T" for Transluxion with glowing presence -->
  <g filter="url(#glow)">
    <!-- Top crossbar -->
    <rect x="136" y="148" width="240" height="48" rx="16" fill="url(#gradEmerald)" />
    <!-- Vertical stem -->
    <rect x="232" y="148" width="48" height="216" rx="16" fill="url(#gradEmerald)" />
  </g>

  <!-- Solid presence check dot at bottom right -->
  <circle cx="364" cy="364" r="48" fill="#020617" stroke="#10b981" stroke-width="6" />
  <circle cx="364" cy="364" r="36" fill="#10b981" />
  <polyline points="352,364 361,373 378,355" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
